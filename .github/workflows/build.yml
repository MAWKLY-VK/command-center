# Builds Command Center and runs its tests on every push to main and on every pull request, on Windows like the
# program itself. Everything runs on the 32-bit .NET SDK, as Command Center and its tests are 32-bit. Actions are pinned
# to a commit, with their release in a comment, and NuGet restores only what the lock files name (CI=true makes every
# restore locked, see Directory.Build.props).
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The 32-bit SDK brings the 32-bit runtimes the tests need, with no install script of our own
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          architecture: x86

      - name: Restore from the lock files
        run: dotnet restore CommandCenter.slnx --locked-mode

      - name: Test
        run: dotnet test tests/CommandCenter.Tests/CommandCenter.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Build the map library tool
        run: dotnet build tools/MapLibraryBuilder/MapLibraryBuilder.csproj -c Release

      - name: Build the release program
        run: dotnet publish src/CommandCenter.App/CommandCenter.App.csproj -c Release -r win-x86 --self-contained false -o out -p:PublishSingleFile=true

      - name: Keep the program for trying out
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CommandCenter-${{ github.sha }}
          path: out/CommandCenter.exe
          retention-days: 14
